<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00b8d2">
  <title>Offline · MotoBook</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f1fbfd; color: #142238; }
    main { width: min(88vw, 28rem); padding: 2rem; border: 1px solid #d5edf1; border-radius: 1.5rem; background: white; text-align: center; box-shadow: 0 16px 44px #0c4a6e12; }
    img { width: 5rem; height: 5rem; margin: 0 auto 1rem; border-radius: 1rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    p { margin: 0; color: #5c6e81; line-height: 1.6; }
    button { min-height: 2.8rem; margin-top: 1.25rem; padding: .6rem 1.2rem; border: 0; border-radius: .8rem; background: #00a9c7; color: white; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="images/motobook-app-192.png" alt="MotoBook">
    <h1>You’re offline</h1>
    <p>Connect to the internet to sign in and load the latest orders and account information.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
